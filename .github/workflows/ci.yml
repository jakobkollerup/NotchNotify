name: NotchNotify CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: bash scripts/test.sh --skip AXIntegrationTests
      - name: Build signed app bundle
        run: ARCHS="arm64 x86_64" bash scripts/build-notch.sh
      - name: Verify bundle and branding
        run: python3 scripts/check-branding.py --app build/NotchNotify.app
